<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeroTaken — promo film</title>
<style>
  :root{ --bg:#eef2f8; --panel:#ffffff; --line:#d8e0ec; --ink:#0b1220; --dim:#6b7688; --accent:#10b981; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; background:
      radial-gradient(60% 40% at 20% 0%, rgba(16,185,129,.10), transparent 60%),
      radial-gradient(50% 40% at 90% 20%, rgba(109,91,255,.10), transparent 60%), var(--bg);
    color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; min-height:100vh; }
  #stage{ position:relative; border-radius:22px; overflow:hidden; background:#fff;
    box-shadow:0 30px 80px rgba(17,28,48,.20), 0 0 0 1px var(--line); line-height:0; }
  canvas{display:block; width:100%; height:auto;}
  .bar{display:flex; align-items:center; gap:14px; width:100%; max-width:430px;}
  button{ background:var(--panel); color:var(--ink); border:1px solid var(--line);
    padding:9px 18px; border-radius:999px; cursor:pointer; font-size:13px;
    font-weight:700; letter-spacing:.02em; box-shadow:0 2px 8px rgba(17,28,48,.06);
    transition:border-color .15s, background .15s; }
  button:hover{border-color:var(--accent)}
  input[type=range]{flex:1; accent-color:var(--accent); cursor:pointer}
  .t{font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; min-width:84px; text-align:right}
  .hint{color:var(--dim); font-size:12px; text-align:center; max-width:460px}
  code{background:#fff; border:1px solid var(--line); padding:1px 6px; border-radius:5px; font-size:11px}
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>
<audio id="au" src="__AUDIO__" preload="auto"></audio>

<div class="bar">
  <button id="play">Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0" step="1">
  <span class="t" id="time">0.00 / 0.00</span>
</div>
<div class="hint">Press play for sound. Scrub to inspect any frame. Edit <code>BRAND</code> and <code>TIMELINE</code> in the script below to re-skin or re-time.</div>

<script>
/*__ENGINE__*/
</script>

<script>
(function(){
  var cvs = document.getElementById('c');
  cvs.width = PROMO.W; cvs.height = PROMO.H;
  var ctx = cvs.getContext('2d');
  var au = document.getElementById('au');
  var playBtn = document.getElementById('play'), seek = document.getElementById('seek'), tEl = document.getElementById('time');

  function fit(){
    var maxH = Math.max(320, window.innerHeight - 190);
    var maxW = Math.min(window.innerWidth - 48, 430);
    var h = Math.min(maxH, maxW * (PROMO.H/PROMO.W));
    document.getElementById('stage').style.width = (h * PROMO.W/PROMO.H) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  /* Audio is the clock whenever it is running, so the voiceover can never
     drift away from the picture. */
  var playing = false, t = 0, last = performance.now(), scrubbing = false;
  function render(){
    PROMO.drawFrame(ctx, t);
    tEl.textContent = t.toFixed(2) + ' / ' + PROMO.DUR.toFixed(2);
    if(!scrubbing) seek.value = Math.round(t / PROMO.DUR * 1000);
  }
  function loop(now){
    var dt = Math.min(0.05, (now - last)/1000); last = now;
    if(playing){
      if(!au.paused && !au.ended && au.readyState > 1) t = au.currentTime;
      else { t += dt; if(t >= PROMO.DUR){ t = 0; if(au.readyState>1){ au.currentTime = 0; au.play(); } } }
      if(t >= PROMO.DUR) t = 0;
    }
    render(); requestAnimationFrame(loop);
  }
  au.addEventListener('ended', function(){ au.currentTime = 0; au.play(); });
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    if(playing){ au.currentTime = t; au.play().catch(function(){}); } else au.pause();
  });
  seek.addEventListener('input', function(){ scrubbing = true; t = seek.value/1000*PROMO.DUR; au.currentTime = t; render(); });
  seek.addEventListener('change', function(){ scrubbing = false; });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
